plugins {
    id 'com.android.application' version '8.5.2'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

def personal = new Properties()
def personalFile = file('personal.properties')
if (personalFile.exists()) personalFile.withInputStream { personal.load(it) }

android {
    namespace 'dev.mrrosoff.braviatv'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.mrrosoff.braviatv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        resValue 'string', 'birthdays', personal.getProperty('birthdays', '')
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB, never published: the debug key is enough.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin's reflection metadata: this app uses no reflection, so it is 30 KB of nothing.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'kotlin-tooling-metadata.json', 'DebugProbesKt.bin']
        }
    }

    // One flat module: the manifest, src/ (Kotlin, package dev.mrrosoff.braviatv) and res/ sit next to this file.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            kotlin.srcDirs = ['src']
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    lint {
        // AGP 9 needs Gradle 9: an upgrade of its own, not something to be nagged about on every build.
        disable 'AndroidGradlePluginVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
