plugins {
    id 'com.android.application' version '8.5.2'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

// The TV this build is for: -Ptv=<path to tvs/<name>> (install.sh passes it). That folder's tv.properties
// holds everything TV-specific, and its gitignored personal.properties the household's birthdays.
// Without -Ptv the build is generic: no hidden apps, no Live TV row, no remote scancodes.
def tvDir = providers.gradleProperty('tv').map { file(it) }.orNull
def loadProps = { File f ->
    def p = new Properties()
    if (f != null && f.exists()) f.withInputStream { p.load(it) }
    p
}
def tv = loadProps(tvDir ? new File(tvDir, 'tv.properties') : null)
def personal = loadProps(tvDir ? new File(tvDir, 'personal.properties') : null)
if (tvDir && tv.isEmpty()) throw new GradleException("No tv.properties in $tvDir")
def scancode = { String key -> Integer.decode(tv.getProperty(key, '0').trim()).toString() }

android {
    namespace 'dev.mrrosoff.tv.dot'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.mrrosoff.tv.dot'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        resValue 'string', 'birthdays', personal.getProperty('birthdays', '')
        resValue 'string', 'tv_live_tv_package', tv.getProperty('live_tv_package', '')
        resValue 'string', 'tv_hidden_apps', tv.getProperty('hidden_apps', '').replaceAll('\\s', '')
        resValue 'integer', 'tv_input_scancode', scancode('remote_input_scancode')
        resValue 'integer', 'tv_settings_scancode', scancode('remote_settings_scancode')
        resValue 'string', 'weather_units', tv.getProperty('weather_units', 'celsius')
        resValue 'string', 'weather_fallback_city', tv.getProperty('weather_fallback_city', '')
        resValue 'string', 'weather_fallback_latitude', tv.getProperty('weather_fallback_latitude', '0')
        resValue 'string', 'weather_fallback_longitude', tv.getProperty('weather_fallback_longitude', '0')
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB, never published: the debug key is enough.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin's reflection metadata: this app uses no reflection, so it is 30 KB of nothing.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'kotlin-tooling-metadata.json', 'DebugProbesKt.bin']
        }
    }

    // One flat module: the manifest, src/ (Kotlin, package dev.mrrosoff.tv.dot) and res/ sit next to this file.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            kotlin.srcDirs = ['src']
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    lint {
        // AGP 9 needs Gradle 9: an upgrade of its own, not something to be nagged about on every build.
        disable 'AndroidGradlePluginVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
