# Everything about this TV that the launchers and scripts need. A different TV gets its own folder in tvs/
# with its own copy of this file; nothing TV-specific lives in launchers/ or tools/.
#
# Sony BRAVIA XR-65A80CJ (65" OLED, platform BRAVIA_VH2), Google TV / Android 12 (API 31),
# build BRAVIA_VH2_M_UC-user 12 STT2.230505.001.S136, US firmware.

name=Sony BRAVIA XR-65A80CJ

# The home screen to give Home back to when reverting (install.sh disables it, revert.sh restores it).
stock_launcher=com.google.android.apps.tv.launcherx/.home.HomeActivity

# The tuner app: the last row of the Inputs menu, and never shown on the wheel.
live_tv_package=com.sony.dtv.tvx

# Apps the wheel hides until they're shown again in Home screen settings on the TV.
hidden_apps=com.sony.dtv.notificationcenter,\
  com.sony.dtv.ecodashboard,\
  com.android.vending,\
  com.spotify.tv.android,\
  com.sony.dtv.timers,\
  com.sony.dtv.seeds.iot,\
  com.sony.dtv.osat.music,\
  com.sony.dtv.smartmediaapp,\
  com.sony.dtv.livingfit

# Remote buttons by Linux scancode (read with `getevent -lt` on the TV). The BRAVIA voice remote
# ("SONY TV VRC 001") sends Sony codes for Input and the gear; 0 means match by Android keycode only.
remote_input_scancode=0x233
remote_settings_scancode=0xc3

# Weather: units, and the place to use when the IP location lookup fails.
weather_units=fahrenheit
weather_fallback_city=San Francisco
weather_fallback_latitude=37.7749
weather_fallback_longitude=-122.4194
